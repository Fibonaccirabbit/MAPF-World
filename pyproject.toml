[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapf-world"
version = "0.1.0.dev1"
description = "City-map generation and action world modeling for multi-agent path finding"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.12"
dependencies = ["numpy>=1.24,<3", "tqdm>=4.66,<5"]

[project.optional-dependencies]
train = ["torch>=2.3", "pyarrow>=14"]
data = [
  "torch>=2.3", "pyarrow>=14", "pogema==1.4.0", "PyYAML>=6,<7", "pydantic>=1.9,<2",
  "pogema-toolbox @ git+https://github.com/Cognitive-AI-Systems/pogema-toolbox.git@8a10cb8d080a642216ed51c79764396a5e242324",
]
benchmark = [
  "torch>=2.3", "pyarrow>=14", "pogema==1.4.0", "PyYAML>=6,<7", "pydantic>=1.9,<2",
  "pogema-toolbox @ git+https://github.com/Cognitive-AI-Systems/pogema-toolbox.git@8a10cb8d080a642216ed51c79764396a5e242324",
]
eval = [
  "torch>=2.3", "pyarrow>=14", "pogema==1.4.0", "PyYAML>=6,<7", "pydantic>=1.9,<2",
  "pogema-toolbox @ git+https://github.com/Cognitive-AI-Systems/pogema-toolbox.git@8a10cb8d080a642216ed51c79764396a5e242324",
]
maps = [
  "geopandas>=1.0,<2", "shapely>=2.0,<3", "rasterio>=1.3,<2",
  "affine>=2.4,<3", "scipy>=1.10,<2", "scikit-image>=0.25,<0.26",
  "ruamel.yaml>=0.18,<0.20", "requests>=2.31,<3", "Pillow>=10,<13",
]
pbf = ["pyrosm>=0.13.1,<0.14"]

[project.scripts]
mapf-world-train = "train.main:main"
mapf-world-generate = "generator.generate_maps:main"
mapf-world-validate = "generator.generate_maps:validate_main"
mapf-world-dataset = "generator.generate_dataset:main"
mapf-world-inference = "inference.run:main"
mapf-world-benchmark = "inference.benchmark:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["train", "model", "inference", "generator", "utils"]
namespaces = true

[tool.setuptools.package-data]
generator = ["native/*.cpp"]

[tool.uv]
# Pin the simulator despite Toolbox's unversioned Git dependency.
override-dependencies = ["pogema==1.4.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
